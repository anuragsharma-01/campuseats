openapi: 3.0.3
info:
  title: CampusEats Orders Service
  version: 1.0.0
  description: REST service for creating, viewing, filtering and cancelling campus food orders.
servers:
  - url: http://localhost:5001
paths:
  /orders:
    post:
      summary: Create an order
      operationId: createOrder
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created
          headers:
            Location:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    get:
      summary: List orders with optional status filter
      operationId: listOrders
      parameters:
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [pending, confirmed, preparing, ready, delivered, cancelled]
      responses:
        '200':
          description: Order list
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderListResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
  /orders/{orderId}:
    get:
      summary: Get one order
      operationId: getOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order returned
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
  /orders/{orderId}/cancellation:
    post:
      summary: Cancel an order
      operationId: cancelOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '202':
          description: Cancellation accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
components:
  parameters:
    OrderId:
      in: path
      name: orderId
      required: true
      schema: {type: string}
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: {type: string}
  schemas:
    CreateOrderRequest:
      type: object
      required: [customer_id, restaurant_id, items]
      properties:
        customer_id: {type: string}
        restaurant_id: {type: string}
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'
        delivery_address: {type: string}
    OrderItem:
      type: object
      required: [menu_item_id, quantity]
      properties:
        menu_item_id: {type: string}
        quantity: {type: integer, minimum: 1}
    OrderResponse:
      type: object
      required: [id, customer_id, restaurant_id, items, status, created_at]
      properties:
        id: {type: string}
        customer_id: {type: string}
        restaurant_id: {type: string}
        items:
          type: array
          items: {$ref: '#/components/schemas/OrderItem'}
        delivery_address: {type: string}
        status: {type: string}
        created_at: {type: string, format: date-time}
    OrderListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/OrderResponse'}
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: Order not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: State conflict
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
    UnprocessableEntity:
      description: Valid request rejected by the domain
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
    ServiceUnavailable:
      description: Payment dependency unavailable
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
