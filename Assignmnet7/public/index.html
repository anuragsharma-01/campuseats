<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusEats – Dish Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #12283d;
      --ink-soft: #4a5d70;
      --paper: #f3f6f9;
      --surface: #ffffff;
      --line: #e1e7ee;
      --brand: #0f766e;
      --brand-dark: #0b5953;
      --ok-bg: #e3f5ec;
      --ok: #166a45;
      --off-bg: #fdeaea;
      --off: #a82d2d;
      --radius: 10px;
      --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
      --font-body: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font-body);
      color: var(--ink);
      background: var(--paper);
      line-height: 1.55;
    }

    .topbar {
      background: var(--ink);
      color: #fff;
      padding: 28px 20px 72px;
    }
    .topbar-inner, main { max-width: 980px; margin: 0 auto; }
    .brand { font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; letter-spacing: .01em; color: #7fe0d4; }
    .topbar h1 { font-family: var(--font-display); font-size: clamp(1.8rem, 4vw, 2.6rem); line-height: 1.15; margin: 10px 0 6px; font-weight: 700; }
    .topbar p { margin: 0; color: #b9c8d6; max-width: 52ch; }

    main { padding: 0 20px 56px; margin-top: -44px; }

    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 22px; }
    .stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
    .stat span { display: block; font-size: .85rem; color: var(--ink-soft); }
    .stat strong { font-family: var(--font-display); font-size: 1.7rem; font-weight: 700; }

    .layout { display: grid; grid-template-columns: 1fr 300px; gap: 22px; align-items: start; }

    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
    .panel-head { padding: 18px 20px; border-bottom: 1px solid var(--line); }
    .panel-head h2 { margin: 0; font-family: var(--font-display); font-size: 1.15rem; }

    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
    .toolbar input[type="search"] { flex: 1 1 180px; }
    .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .seg button { background: #fff; color: var(--ink-soft); border: 0; padding: 9px 14px; font: 500 .88rem var(--font-body); cursor: pointer; }
    .seg button + button { border-left: 1px solid var(--line); }
    .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }

    input[type="text"], input[type="number"], input[type="search"] {
      width: 100%; padding: 10px 12px; font: 400 .95rem var(--font-body); color: var(--ink);
      border: 1px solid #c5d0db; border-radius: 8px; background: #fff;
    }
    input::placeholder { color: #8a99a8; }

    :focus-visible { outline: 3px solid #5fd0c4; outline-offset: 2px; }

    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; font-size: .82rem; font-weight: 600; color: var(--ink-soft); padding: 12px 20px; background: #f8fafc; border-bottom: 1px solid var(--line); }
    td { padding: 14px 20px; border-bottom: 1px solid var(--line); }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: #f8fafc; }
    .id { color: var(--ink-soft); font-variant-numeric: tabular-nums; }
    .name { font-weight: 600; }
    .price { font-variant-numeric: tabular-nums; }

    .pill { display: inline-block; padding: 3px 11px; border-radius: 999px; font-size: .82rem; font-weight: 600; }
    .pill.on { background: var(--ok-bg); color: var(--ok); }
    .pill.off { background: var(--off-bg); color: var(--off); }

    .state { padding: 36px 20px; text-align: center; color: var(--ink-soft); }
    .state strong { display: block; color: var(--ink); margin-bottom: 4px; }
    .skeleton { height: 14px; border-radius: 6px; background: linear-gradient(90deg, #e9eef3 25%, #f4f7fa 50%, #e9eef3 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
    @keyframes shimmer { to { background-position: -200% 0; } }

    form { padding: 18px 20px 20px; display: grid; gap: 14px; }
    label { display: block; font-size: .88rem; font-weight: 600; margin-bottom: 5px; }
    .prefix { position: relative; }
    .prefix span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-soft); }
    .prefix input { padding-left: 28px; }

    .btn { width: 100%; padding: 11px 16px; border: 0; border-radius: 8px; background: var(--brand); color: #fff; font: 600 .95rem var(--font-body); cursor: pointer; }
    .btn:hover { background: var(--brand-dark); }
    .btn:disabled { opacity: .6; cursor: progress; }

    #message { min-height: 1.3em; font-size: .88rem; margin: 0; }
    #message.error { color: var(--off); }
    #message.success { color: var(--ok); }

    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; }
      .stats { gap: 10px; }
      .stat { padding: 12px 14px; }
      .stat strong { font-size: 1.4rem; }
    }

    @media (max-width: 560px) {
      thead { display: none; }
      table, tbody, tr, td { display: block; width: 100%; }
      tr { padding: 12px 20px; border-bottom: 1px solid var(--line); }
      td { padding: 2px 0; border: 0; }
      .id::before { content: "ID "; }
    }

    @media (prefers-reduced-motion: reduce) {
      .skeleton { animation: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">CampusEats</div>
      <h1>Dish manager</h1>
      <p>See what’s on the menu today and add new dishes to the canteen list.</p>
    </div>
  </header>

  <main>
    <section class="stats" aria-label="Menu summary">
      <div class="stat"><span>Total dishes</span><strong id="statTotal">–</strong></div>
      <div class="stat"><span>Available now</span><strong id="statOn">–</strong></div>
      <div class="stat"><span>Unavailable</span><strong id="statOff">–</strong></div>
    </section>

    <div class="layout">
      <section class="panel" aria-labelledby="menuTitle">
        <div class="panel-head"><h2 id="menuTitle">Menu</h2></div>

        <div class="toolbar">
          <input type="search" id="search" placeholder="Search dishes" aria-label="Search dishes">
          <div class="seg" role="group" aria-label="Filter by availability">
            <button type="button" data-filter="all" aria-pressed="true">All</button>
            <button type="button" data-filter="on" aria-pressed="false">Available</button>
            <button type="button" data-filter="off" aria-pressed="false">Unavailable</button>
          </div>
        </div>

        <div id="tableWrap">
          <table>
            <thead>
              <tr><th>ID</th><th>Name</th><th>Price</th><th>Status</th></tr>
            </thead>
            <tbody id="dishRows"></tbody>
          </table>
          <div id="state" class="state" hidden></div>
        </div>
      </section>

      <section class="panel" aria-labelledby="addTitle">
        <div class="panel-head"><h2 id="addTitle">Add a dish</h2></div>
        <form id="addForm" novalidate>
          <div>
            <label for="name">Dish name</label>
            <input id="name" type="text" placeholder="e.g. Masala dosa" autocomplete="off">
          </div>
          <div>
            <label for="price">Price</label>
            <div class="prefix">
              <span>₹</span>
              <input id="price" type="number" min="0" step="0.01" placeholder="0.00">
            </div>
          </div>
          <button class="btn" id="addBtn" type="submit">Add dish</button>
          <p id="message" role="status" aria-live="polite"></p>
        </form>
      </section>
    </div>
  </main>

<script>
const endpoint = '/graphql';
const money = new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR' });

let allDishes = [];
let activeFilter = 'all';

const $ = id => document.getElementById(id);

async function graphql(query, variables = {}) {
  const response = await fetch(endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ query, variables })
  });
  if (!response.ok) throw new Error(`Server returned ${response.status}`);
  return response.json();
}

function escapeHtml(value) {
  const div = document.createElement('div');
  div.textContent = value;
  return div.innerHTML;
}

function setMessage(text, type = '') {
  const el = $('message');
  el.textContent = text;
  el.className = type;
}

function showState(title, detail) {
  const el = $('state');
  el.hidden = false;
  el.innerHTML = `<strong>${escapeHtml(title)}</strong>${escapeHtml(detail)}`;
  $('dishRows').innerHTML = '';
}

function showLoading() {
  $('state').hidden = true;
  $('dishRows').innerHTML = Array.from({ length: 4 }, () =>
    `<tr><td colspan="4"><div class="skeleton"></div></td></tr>`).join('');
}

function updateStats() {
  const on = allDishes.filter(d => d.available).length;
  $('statTotal').textContent = allDishes.length;
  $('statOn').textContent = on;
  $('statOff').textContent = allDishes.length - on;
}

function render() {
  const term = $('search').value.trim().toLowerCase();
  const list = allDishes.filter(d => {
    const matchesFilter = activeFilter === 'all' || (activeFilter === 'on') === d.available;
    return matchesFilter && d.name.toLowerCase().includes(term);
  });

  if (!allDishes.length) {
    return showState('No dishes yet', 'Add the first dish using the form.');
  }
  if (!list.length) {
    return showState('No matching dishes', 'Try a different search or filter.');
  }

  $('state').hidden = true;
  $('dishRows').innerHTML = list.map(d => `
    <tr>
      <td class="id">${escapeHtml(String(d.id))}</td>
      <td class="name">${escapeHtml(d.name)}</td>
      <td class="price">${money.format(Number(d.price))}</td>
      <td><span class="pill ${d.available ? 'on' : 'off'}">${d.available ? 'Available' : 'Unavailable'}</span></td>
    </tr>`).join('');
}

async function loadDishes() {
  showLoading();
  try {
    const result = await graphql(`query { dishes { id name price available } }`);
    if (result.errors) {
      showState('Couldn’t load dishes', result.errors[0].message);
      return;
    }
    allDishes = result.data.dishes;
    updateStats();
    render();
  } catch (err) {
    showState('Couldn’t reach the server', 'Check that the GraphQL server is running at ' + endpoint + '.');
  }
}

async function addDish(event) {
  event.preventDefault();
  const name = $('name').value.trim();
  const price = Number($('price').value);

  if (!name || !(price > 0)) {
    setMessage('Enter a dish name and a price greater than 0.', 'error');
    return;
  }

  const btn = $('addBtn');
  btn.disabled = true;
  btn.textContent = 'Adding…';
  setMessage('');

  try {
    const result = await graphql(`
      mutation AddDish($input: AddDishInput!) {
        addDish(input: $input) { id name price available }
      }
    `, { input: { name, price } });

    if (result.errors) {
      setMessage(result.errors[0].message, 'error');
      return;
    }

    const dish = result.data.addDish;
    setMessage(`Added ${dish.name} (ID ${dish.id}).`, 'success');
    $('addForm').reset();
    await loadDishes();
  } catch (err) {
    setMessage('Couldn’t add the dish. ' + err.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Add dish';
  }
}

$('addForm').addEventListener('submit', addDish);
$('search').addEventListener('input', render);
document.querySelectorAll('.seg button').forEach(btn => {
  btn.addEventListener('click', () => {
    activeFilter = btn.dataset.filter;
    document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
    render();
  });
});

loadDishes();
</script>
</body>
</html>
